    appreciations:['Tell her you appreciate how she always shows up when it matters.','Tell her you notice how hard she works and it doesn’t go unseen.','Tell her you appreciate that she remembers the things that matter to you.','Tell her you feel genuinely safe with her.','Tell her you’re proud of her — out loud, unprompted.','Tell her that being with her feels easy in the best way.'],
    dates:['Book something neither of you has done — surprise her with it.','Plan a full day with no agenda. Drive and see where you end up.','Cook her favourite meal from scratch — make a whole event of it.','Find a live event — band, comedy, sport — and just go.','Plan a weekend trip somewhere neither of you has been.','Find a class you can both try for the first time.','Get her flowers, take her somewhere she’s always wanted to go.','Home movie night: projector, blanket, snacks, her favourite films.'],
    clinic:{
      qs:[
          {ph:'Anger level',q:'What actually happened?',o:[{t:'😬 Said something I instantly regretted',s:1},{t:'😞 Forgot / cancelled / didn’t do something she was counting on',s:2},{t:'💥 A full argument happened — both sides involved',s:3},{t:'😤 I didn’t put her first — she felt it',s:2},{t:'🤷 Genuinely no idea. The vibe just shifted.',s:3}]},
          {ph:'Anger level',q:'How did things end when you last saw each other?',o:[{t:'👋 Awkward but a proper goodbye happened',s:1},{t:'😶 She went quiet and just... left',s:2},{t:'🚶 Door closed with more force than usual',s:3},{t:'📵 I barely registered her going — she was just gone',s:4},{t:'🫤 Said bye but you both knew it wasn’t right',s:2}]},
          {ph:'Anger level',q:'Her first message to you after?',o:[{t:'💬 Casual — as if nothing happened',s:1},{t:'🧊 Functional only — "got home" / "ok"',s:2},{t:'⏳ Nothing yet, but I haven’t reached out either',s:2},{t:'😶 Nothing — I went first and she hasn’t replied',s:3},{t:'📵 Nothing — message not even delivered',s:4}]},
          {ph:'Anger level',q:'You reached out — what happened?',o:[{t:'💬 She replied, but shorter and colder',s:1},{t:'😐 She replied — but every message has a double meaning',s:2},{t:'👀 Read. No response.',s:3},{t:'🔇 She’s replying to others but not to me',s:3},{t:'📵 Nothing. Possibly blocked.',s:4}]},
          {ph:'Anger level',q:'Her social media and general whereabouts?',o:[{t:'📱 Normal — nothing out of the ordinary',s:1},{t:'😢 Posted a sad song or something emotional',s:2},{t:'😶 Gone quiet everywhere — no activity',s:3},{t:'🔒 Active but I’ve been set to restricted',s:4},{t:'🏃 Out with friends, posting, apparently living her best life',s:2}]},
          {ph:'Anger level',q:'Seeing her in person or on a call?',o:[{t:'😐 Cool but not openly avoiding me',s:1},{t:'📱 Present but checked out — phone, short replies',s:2},{t:'👁️ Barely looking at me',s:3},{t:'🚪 Can’t reach her — she’s suddenly unavailable',s:3},{t:'💀 We saw each other. It did not go well.',s:4}]},
          {ph:'Anger level',q:'Her friends’ attitude toward you since?',o:[{t:'🤷 No change — she probably hasn’t said anything',s:1},{t:'😐 One friend acting strangely toward me',s:2},{t:'❄️ Her group has visibly gone cold on me',s:3},{t:'🚫 Multiple people in her circle suddenly very "busy"',s:4},{t:'🤝 No change — they seem to be on my side',s:1}]},
          {ph:'Anger level',q:'You apologised — what happened?',o:[{t:'😮‍💨 Yes — "I’m fine" in the least fine voice ever',s:1},{t:'🤔 Yes — she asked "where exactly did you go wrong?"',s:2},{t:'💀 Yes — "what’s even the point of apologising"',s:4},{t:'🤷 Not yet — I honestly don’t know what to apologise for',s:2},{t:'📈 Yes — she seemed to slowly start softening',s:1}]},
          {ph:'Anger level',q:'Honestly, how bad is this?',o:[{t:'😅 Minor — she might be slightly overreacting',s:1},{t:'😬 Real and fair — I know I dropped the ball',s:2},{t:'😤 Serious — her friends would completely take her side',s:3},{t:'🤷 Unknown — I genuinely don’t know what I triggered',s:2},{t:'💀 Very bad. I’m almost scared to reach out.',s:4}]},
          {ph:'Anger level',q:'The last thing she said to you was?',o:[{t:'😶 "Fine." or nothing — just walked away',s:1},{t:'😑 "Think carefully about what you did"',s:2},{t:'🧊 "Leave" / "don’t bother me"',s:3},{t:'💀 Something that ended any further conversation',s:4},{t:'🤐 Silence. Just silence.',s:4}]},
          {ph:'Reading her type',q:'When she’s upset, her style is?',o:[{t:'💣 Says it directly — no guessing games needed',tp:'A'},{t:'🧊 Goes cold and quiet — the room temperature drops',tp:'B'},{t:'😇 "I’m fine." in the least fine way possible',tp:'C'},{t:'💔 Doesn’t hide it — gets visibly emotional, may cry',tp:'H'},{t:'📱 Sends one cryptic message or post for you to decode',tp:'D'}]},
          {ph:'Reading her type',q:'What has genuinely worked to fix things before?',o:[{t:'🍜 Food — take her to eat her favourite and watch the change',tp:'C'},{t:'🎁 A thoughtful gift or gesture — effort is everything to her',tp:'H'},{t:'💬 A real conversation where she feels genuinely heard',tp:'A'},{t:'⏰ Space and time — she needs to process, don’t rush',tp:'F'},{t:'🫂 Just showing up and being there — no words needed',tp:'J'}]},
          {ph:'Reading her type',q:'What’s she normally like?',o:[{t:'☀️ Fun and social — this is very unlike her',tp:'A'},{t:'💭 Thoughtful and sensitive — feels and notices everything',tp:'J'},{t:'👑 Strong and independent — not quick to show vulnerability',tp:'E'},{t:'🍕 A total foodie — a great meal genuinely helps',tp:'C'},{t:'🤗 Very caring and nurturing — always looking after people',tp:'B'}]},
          {ph:'Reading her type',q:'When you give her a gift or do something nice, she usually?',o:[{t:'😍 Lights up immediately and tells everyone',tp:'G'},{t:'🤔 "You didn’t have to do this" — but you definitely did',tp:'H'},{t:'🔬 Asks where you got it and how much it cost',tp:'F'},{t:'🙄 Eye-roll, then secretly loves it and won’t admit it',tp:'E'},{t:'🥹 Gets genuinely moved — keeps it close and mentions it later',tp:'J'}]},
          {ph:'Reading her type',q:'When stressed about something unrelated to you, she?',o:[{t:'🍕 Eats her comfort food — food always helps her reset',tp:'C'},{t:'📱 Calls her friends — needs her people around her',tp:'G'},{t:'🤐 Goes quiet and processes it alone',tp:'J'},{t:'🏃 Gets active — walks, shops, does something physical',tp:'A'},{t:'📚 Channels it into something productive — work, writing',tp:'D'}]},
          {ph:'Reading her type',q:'How does she handle being hurt in general?',o:[{t:'💬 Says what’s wrong, what she needs, what happens next',tp:'A'},{t:'😶 Goes quiet — you have to notice and ask',tp:'J'},{t:'😤 Gets frustrated first, emotional later',tp:'E'},{t:'📝 Processes it deeply — might write about it',tp:'D'},{t:'😢 Feels it openly and immediately — no hiding',tp:'H'}]},
          {ph:'Reading her type',q:'In the relationship, she’s more of a?',o:[{t:'💫 Prioritiser — she puts you first and expects the same',tp:'A'},{t:'🤝 Caretaker — loves looking after the people she loves',tp:'B'},{t:'😂 Fun-maker — the relationship should always feel light and good',tp:'C'},{t:'🧠 Understander — she wants to feel deeply known',tp:'D'},{t:'🌹 Romantic — love needs to be actively shown and felt',tp:'H'}]},
          {ph:'Reading her type',q:'A week from now, how will she have processed this?',o:[{t:'🤝 Talked it through genuinely and moved on',tp:'A'},{t:'⏳ Still feels something but won’t bring it up',tp:'J'},{t:'🎉 Out with friends, has largely vented and moved on',tp:'G'},{t:'📖 Journalled it, analysed it, written pages about it',tp:'D'},{t:'😤 Outwardly fine — internally still carrying it',tp:'E'}]},
          {ph:'Reading her type',q:'When you are struggling or upset, she?',o:[{t:'🤗 Immediately tries to look after you — drops everything',tp:'B'},{t:'💬 Sits with you and listens — genuinely wants to hear it',tp:'A'},{t:'🍜 Gets food — nurturing through feeding is her love language',tp:'C'},{t:'🎁 Does something thoughtful — surprises you to cheer you up',tp:'G'},{t:'🤐 Gives you space — waits for you to come to her',tp:'J'}]},
          {ph:'Reading her type',q:'Her life philosophy is closest to?',o:[{t:'💫 "I give my best to the people I love. I expect the same."',tp:'A'},{t:'🤝 "Looking after people you love is just... what you do."',tp:'B'},{t:'😂 "Life’s too short to not laugh every single day."',tp:'C'},{t:'🧠 "The deepest connections are the ones where you’re truly seen."',tp:'D'},{t:'🌹 "Love isn’t a feeling. It’s a daily choice that should be shown."',tp:'H'}]}

      types:{
        A:{n:'Straight Shooter',d:'Transparent emotions. Angry = angry. Fast apology = fast forgiveness. No games.',tg:['Emotional clarity','No cold wars','Apologise now'],bg:'#FAECE7',bd:'#F0997B',tc:'#993C1D',ac:'#D85A30',tips:[{lv:'🧋',t:'Say "I was wrong" — three words, one second. That’s all she wants.'},{lv:'🎁',t:'Buy her favourite snack or drink, put it in front of her, say nothing.'},{lv:'💸',t:'"What do you want? I’ll go get it." Then actually go. No flinching.'},{lv:'🏬',t:'"You choose, I pay" — no budget limit. Take her to a shop now.'},{lv:'💀',t:'Get on your knees and apologise. The Straight Shooter responds to this 100%.'}]},
        B:{n:'Mom Mode',d:'Her love language is caring. Even angry she’ll ask if you ate. Show you care for her too.',tg:['Caretaker instinct','Still caring for you','You care for her'],bg:'#FAEEDA',bd:'#EF9F27',tc:'#633806',ac:'#BA7517',tips:[{lv:'🧋',t:'First message: "did you eat today?" Then secretly order her favourite delivery.'},{lv:'🎁',t:'A variety pack of her favourite snacks. Let her choose. Being pampered is the point.'},{lv:'💸',t:'Handle that thing she’s wanted done but hasn’t had energy for. Better than any gift.'},{lv:'🏬',t:'Record every need she’s mentioned lately and fulfil them all at once.'},{lv:'💀',t:'"You always look after me — but who looks after you?" Then take over her life for a week.'}]},
        C:{n:'Food Healer',d:'Food fixes 80% of her bad mood. The other 20% is also food.',tg:['Food is everything','Fed = forgiving','Stomach is the shortcut'],bg:'#EAF3DE',bd:'#97C459',tc:'#173404',ac:'#3B6D11',tips:[{lv:'🧋',t:'Her favourite drink, large, full sugar, don’t ask — deliver immediately.'},{lv:'🎁',t:'Big snack haul of her favourites, plus a note. Food + sincerity = double hit.'},{lv:'💸',t:'Book that restaurant she’s always wanted. Tonight. However expensive.'},{lv:'🏬',t:'"You pick everything today. I’m paying." Watch her start to soften.'},{lv:'💀',t:'Show up at her door. Say "take me to that thing you always wanted to eat."'}]},
        D:{n:'Meme Queen',d:'Uses humour to fight off everything bad. Happiest energy in everyone’s feed.',tg:['Humour is armour','Laugh then forgive','Meme = peace offering'],bg:'#EEEDFE',bd:'#AFA9EC',tc:'#26215C',ac:'#534AB7',tips:[{lv:'🧋',t:'Send a meme you’ve both laughed at before, with nothing. She knows this is your peace offering.'},{lv:'🎁',t:'Pile of weird but funny gifts. The more random the better. Make her laugh first.'},{lv:'💸',t:'Commission something with your private meme on it. She’ll break then forgive you.'},{lv:'🏬',t:'Plan a ridiculous public apology with her friends involved.'},{lv:'💀',t:'Make a funny sincere apology video, post online asking for shares. Laugh first, cry second.'}]},
        E:{n:'Tsundere Queen',d:'Mouth says she doesn’t care, body is completely honest. More stubborn = more she cares.',tg:['Tough outside','Soft inside','Patience wins everything'],bg:'#FBEAF0',bd:'#ED93B1',tc:'#4B1528',ac:'#993556',tips:[{lv:'🧋',t:'Give her space. Don’t barrage her with messages — pushing only makes her dig in harder.'},{lv:'🎁',t:'Plant a little surprise where she’ll find it. Don’t hand it over — too obvious.'},{lv:'💸',t:'Buy that thing she hinted at but was too stubborn to buy herself.'},{lv:'🏬',t:'When she shows any softening, take her shopping: "you choose." Picking is forgiving.'},{lv:'💀',t:'One small thing every day, no expectations. After 7 days she’ll speak first.'}]},
        F:{n:'Lazy Goddess',d:'Too tired to stay angry long. Has feelings but can’t be bothered to perform them.',tg:['Low drama energy','Make her life easier','Practical beats romance'],bg:'#F1EFE8',bd:'#B4B2A9',tc:'#2C2C2A',ac:'#5F5E5A',tips:[{lv:'🧋',t:'"You don’t need to be angry, I’ll be angry for you while you rest." Get her laughing first.'},{lv:'🎁',t:'Just order her usual delivery — you’ve even saved her the effort of choosing.'},{lv:'💸',t:'Buy something practical she’s needed but was too lazy to get. Better than any romantic gesture.'},{lv:'🏬',t:'Handle all her recent annoying errands. She’ll realise you’re more useful than an apology.'},{lv:'💀',t:'Lie around with her for a full day, order in, watch shows, sleep. Just being there is enough.'}]},
        G:{n:'Attention Magnet',d:'Born with a spotlight on her. Even her sulking is photogenic. If it’s not on camera it didn’t happen.',tg:['Spotlight always on','Everything is content','Good photos cure things'],bg:'#FBEAF0',bd:'#ED93B1',tc:'#4B1528',ac:'#D4537E',tips:[{lv:'🌸',t:'Buy flowers — they need to be photogenic. She’ll post them, and you’ll appear in her feed.'},{lv:'🎁',t:'Plan something with incredible presentation. Her reaching for her phone = moment of forgiveness.'},{lv:'💸',t:'Take her somewhere beautiful and be her photographer all day.'},{lv:'🏬',t:'Book a visually stunning restaurant or themed room. She’ll post the moment she walks in.'},{lv:'💀',t:'Set up something so beautiful she forgets to be angry before she starts photographing.'}]},
        H:{n:'Hopeless Romantic',d:'Love is the centre of her universe. Brain is 80% memories and future plans involving you.',tg:['Love is everything','Gesture must mean something','We > I'],bg:'#E6F1FB',bd:'#85B7EB',tc:'#042C53',ac:'#185FA5',tips:[{lv:'💌',t:'Pull out your best chat screenshots. Make a photo album. Send it saying "these are my most treasured things."'},{lv:'🌹',t:'Flowers + handwritten letter with specific memories only you two share.'},{lv:'💸',t:'Walk her back through your first date, recalling every detail. She will cry.'},{lv:'🏬',t:'Book somewhere meaningful, prepare in advance. Let her feel you put this relationship first.'},{lv:'💀',t:'Plan something exclusively for you two, however expensive. She just needs to know you care about "us."'}]},
        I:{n:'Deep Thinker',d:'Deeply sensitive, one small thing triggers philosophical essays. Every message is an epic.',tg:['Feelings run very deep','One sentence breaks her','Listen — don’t explain'],bg:'#FAEEDA',bd:'#FAC775',tc:'#412402',ac:'#854F0B',tips:[{lv:'📝',t:'Write something that reaches the real layer she cares about. Surface level won’t work.'},{lv:'📚',t:'Buy her a book in her favourite genre with a note explaining why. She’ll reread the note more.'},{lv:'☕',t:'Take her for coffee, ask "what were you really feeling." Then only listen. Don’t argue.'},{lv:'💸',t:'Take her somewhere quiet and quality. Let her say everything. You being there is enough.'},{lv:'💀',t:'Write a very long letter — not an apology, a full reflection on your relationship.'}]},
        J:{n:'Sensitive Soul',d:'Easily hurt, rarely shows it. But once she speaks it’s profound. One sentence wrecks her day.',tg:['Feelings hidden deep','Just be there','Priceless costs nothing'],bg:'#E1F5EE',bd:'#5DCAA5',tc:'#04342C',ac:'#0F6E56',tips:[{lv:'🤍',t:'Send "are you ok" — just those words. No cause, no context. Just asking.'},{lv:'🎁',t:'Quietly place something small where she’ll find it. No words. Let her discover it.'},{lv:'🍱',t:'Order what she likes, no reply needed. Just show you remember her preferences.'},{lv:'💸',t:'Do something she enjoys — a walk, a film — no mention of the fight. Just company.'},{lv:'💀',t:'Give her a very long, very tight hug and say nothing. This is everything she needs.'}]}
      }
    }
  },

}

  document.getElementById('mem-inp').addEventListener('keydown',function(e){if(e.key==='Enter')addMem();});
  document.body.className='lang-'+lang;
  document.getElementById('btn-en').className='lb'+(lang==='en'?' on':'');
  document.getElementById('btn-zh').className='lb'+(lang==='zh'?' on':'');
  render();
});
</script>
