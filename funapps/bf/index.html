      types:{
        A:{n:'Straight Shooter',d:'Transparent emotions. Angry = angry. Fast apology = fast forgiveness. No games.',tg:['Emotional clarity','No cold wars','Apologise now'],bg:'#FAECE7',bd:'#F0997B',tc:'#993C1D',ac:'#D85A30',tips:[{lv:'🧋',t:'Say "I was wrong" — three words, one second. That\'s all she wants.'},{lv:'🎁',t:'Buy her favourite snack or drink, put it in front of her, say nothing.'},{lv:'💸',t:'"What do you want? I\'ll go get it." Then actually go. No flinching.'},{lv:'🏬',t:'"You choose, I pay" — no budget limit. Take her to a shop now.'},{lv:'💀',t:'Get on your knees and apologise. The Straight Shooter responds to this 100%.'}]},
        B:{n:'Mom Mode',d:'Her love language is caring. Even angry she\'ll ask if you ate. Show you care for her too.',tg:['Caretaker instinct','Still caring for you','You care for her'],bg:'#FAEEDA',bd:'#EF9F27',tc:'#633806',ac:'#BA7517',tips:[{lv:'🧋',t:'First message: "did you eat today?" Then secretly order her favourite delivery.'},{lv:'🎁',t:'A variety pack of her favourite snacks. Let her choose. Being pampered is the point.'},{lv:'💸',t:'Handle that thing she\'s wanted done but hasn\'t had energy for. Better than any gift.'},{lv:'🏬',t:'Record every need she\'s mentioned lately and fulfil them all at once.'},{lv:'💀',t:'"You always look after me — but who looks after you?" Then take over her life for a week.'}]},
        C:{n:'Food Healer',d:'Food fixes 80% of her bad mood. The other 20% is also food.',tg:['Food is everything','Fed = forgiving','Stomach is the shortcut'],bg:'#EAF3DE',bd:'#97C459',tc:'#173404',ac:'#3B6D11',tips:[{lv:'🧋',t:'Her favourite drink, large, full sugar, don\'t ask — deliver immediately.'},{lv:'🎁',t:'Big snack haul of her favourites, plus a note. Food + sincerity = double hit.'},{lv:'💸',t:'Book that restaurant she\'s always wanted. Tonight. However expensive.'},{lv:'🏬',t:'"You pick everything today. I\'m paying." Watch her start to soften.'},{lv:'💀',t:'Show up at her door. Say "take me to that thing you always wanted to eat."'}]},
        D:{n:'Meme Queen',d:'Uses humour to fight off everything bad. Happiest energy in everyone\'s feed.',tg:['Humour is armour','Laugh then forgive','Meme = peace offering'],bg:'#EEEDFE',bd:'#AFA9EC',tc:'#26215C',ac:'#534AB7',tips:[{lv:'🧋',t:'Send a meme you\'ve both laughed at before, with nothing. She knows this is your peace offering.'},{lv:'🎁',t:'Pile of weird but funny gifts. The more random the better. Make her laugh first.'},{lv:'💸',t:'Commission something with your private meme on it. She\'ll break then forgive you.'},{lv:'🏬',t:'Plan a ridiculous public apology with her friends involved.'},{lv:'💀',t:'Make a funny sincere apology video, post online asking for shares. Laugh first, cry second.'}]},
        E:{n:'Tsundere Queen',d:'Mouth says she doesn\'t care, body is completely honest. More stubborn = more she cares.',tg:['Tough outside','Soft inside','Patience wins everything'],bg:'#FBEAF0',bd:'#ED93B1',tc:'#4B1528',ac:'#993556',tips:[{lv:'🧋',t:'Give her space. Don\'t barrage her with messages — pushing only makes her dig in harder.'},{lv:'🎁',t:'Plant a little surprise where she\'ll find it. Don\'t hand it over — too obvious.'},{lv:'💸',t:'Buy that thing she hinted at but was too stubborn to buy herself.'},{lv:'🏬',t:'When she shows any softening, take her shopping: "you choose." Picking is forgiving.'},{lv:'💀',t:'One small thing every day, no expectations. After 7 days she\'ll speak first.'}]},
        F:{n:'Lazy Goddess',d:'Too tired to stay angry long. Has feelings but can\'t be bothered to perform them.',tg:['Low drama energy','Make her life easier','Practical beats romance'],bg:'#F1EFE8',bd:'#B4B2A9',tc:'#2C2C2A',ac:'#5F5E5A',tips:[{lv:'🧋',t:'"You don\'t need to be angry, I\'ll be angry for you while you rest." Get her laughing first.'},{lv:'🎁',t:'Just order her usual delivery — you\'ve even saved her the effort of choosing.'},{lv:'💸',t:'Buy something practical she\'s needed but was too lazy to get. Better than any romantic gesture.'},{lv:'🏬',t:'Handle all her recent annoying errands. She\'ll realise you\'re more useful than an apology.'},{lv:'💀',t:'Lie around with her for a full day, order in, watch shows, sleep. Just being there is enough.'}]},
        G:{n:'Attention Magnet',d:'Born with a spotlight on her. Even her sulking is photogenic. If it\'s not on camera it didn\'t happen.',tg:['Spotlight always on','Everything is content','Good photos cure things'],bg:'#FBEAF0',bd:'#ED93B1',tc:'#4B1528',ac:'#D4537E',tips:[{lv:'🌸',t:'Buy flowers — they need to be photogenic. She\'ll post them, and you\'ll appear in her feed.'},{lv:'🎁',t:'Plan something with incredible presentation. Her reaching for her phone = moment of forgiveness.'},{lv:'💸',t:'Take her somewhere beautiful and be her photographer all day.'},{lv:'🏬',t:'Book a visually stunning restaurant or themed room. She\'ll post the moment she walks in.'},{lv:'💀',t:'Set up something so beautiful she forgets to be angry before she starts photographing.'}]},
        H:{n:'Hopeless Romantic',d:'Love is the centre of her universe. Brain is 80% memories and future plans involving you.',tg:['Love is everything','Gesture must mean something','We > I'],bg:'#E6F1FB',bd:'#85B7EB',tc:'#042C53',ac:'#185FA5',tips:[{lv:'💌',t:'Pull out your best chat screenshots. Make a photo album. Send it saying "these are my most treasured things."'},{lv:'🌹',t:'Flowers + handwritten letter with specific memories only you two share.'},{lv:'💸',t:'Walk her back through your first date, recalling every detail. She will cry.'},{lv:'🏬',t:'Book somewhere meaningful, prepare in advance. Let her feel you put this relationship first.'},{lv:'💀',t:'Plan something exclusively for you two, however expensive. She just needs to know you care about "us."'}]},
        I:{n:'Deep Thinker',d:'Deeply sensitive, one small thing triggers philosophical essays. Every message is an epic.',tg:['Feelings run very deep','One sentence breaks her','Listen — don\'t explain'],bg:'#FAEEDA',bd:'#FAC775',tc:'#412402',ac:'#854F0B',tips:[{lv:'📝',t:'Write something that reaches the real layer she cares about. Surface level won\'t work.'},{lv:'📚',t:'Buy her a book in her favourite genre with a note explaining why. She\'ll reread the note more.'},{lv:'☕',t:'Take her for coffee, ask "what were you really feeling." Then only listen. Don\'t argue.'},{lv:'💸',t:'Take her somewhere quiet and quality. Let her say everything. You being there is enough.'},{lv:'💀',t:'Write a very long letter — not an apology, a full reflection on your relationship.'}]},
        J:{n:'Sensitive Soul',d:'Easily hurt, rarely shows it. But once she speaks it\'s profound. One sentence wrecks her day.',tg:['Feelings hidden deep','Just be there','Priceless costs nothing'],bg:'#E1F5EE',bd:'#5DCAA5',tc:'#04342C',ac:'#0F6E56',tips:[{lv:'🤍',t:'Send "are you ok" — just those words. No cause, no context. Just asking.'},{lv:'🎁',t:'Quietly place something small where she\'ll find it. No words. Let her discover it.'},{lv:'🍱',t:'Order what she likes, no reply needed. Just show you remember her preferences.'},{lv:'💸',t:'Do something she enjoys — a walk, a film — no mention of the fight. Just company.'},{lv:'💀',t:'Give her a very long, very tight hug and say nothing. This is everything she needs.'}]}
      }
    }

var cQ=0,cSc=0,cV={};
function doy(){var n=new Date();return Math.floor((n-new Date(n.getFullYear(),0,0))/86400e3)}
function seed(a,s){return a[s%a.length]}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}

function setLang(l){
  lang=l;localStorage.setItem('bf_lang',l);
  document.body.className='lang-'+l;
  document.getElementById('btn-en').className='lb'+(l==='en'?' on':'');
  document.getElementById('btn-zh').className='lb'+(l==='zh'?' on':'');
  render();cReset();
}

  document.getElementById('T_title').textContent=t.title;

function renderFeats(){

  var titles=t.flabel;
  var icons=['💬','❓','🙏','🎯'],labels=t.featBtns||['Generate','Get one','Generate','Suggest one'];
  var ftitles=lang==='en'?['Compliment her','Question to ask','Appreciation drop','Date idea']:['夸夸她','今晚聊什么','今日感谢','约会去哪'];
  var fbtns=lang==='en'?['Generate','Get one','Generate','Suggest one']:['生成','换一个','生成','换一个'];

function addMem(){
  var i=document.getElementById('mem-inp'),tx=i.value.trim();if(!tx)return;
  var ms=JSON.parse(localStorage.getItem('bf_mems')||'[]');
  ms.unshift({t:tx,d:new Date().toLocaleDateString(lang==='zh'?'zh-CN':'en-AU',{day:'numeric',month:'short',year:'numeric'}),id:Date.now()});
  localStorage.setItem('bf_mems',JSON.stringify(ms));i.value='';renderMems();
}
function delMem(id){
  var ms=JSON.parse(localStorage.getItem('bf_mems')||'[]').filter(function(x){return x.id!==id});
  localStorage.setItem('bf_mems',JSON.stringify(ms));renderMems();
}
function renderMems(){
  var ms=JSON.parse(localStorage.getItem('bf_mems')||'[]'),g=document.getElementById('mem-grid');
  if(!ms.length){g.innerHTML='<div class="mem-empty">'+(lang==='zh'?'你的记忆罐还是空的…':'Your memory jar is empty...')+'</div>';return;}
  g.innerHTML=ms.map(function(m){return'<div class="mi">'+m.t+'<span class="md">'+m.d+'</span><button class="mx" onclick="delMem('+m.id+')">✕</button></div>';}).join('');
}

function renderAchs(){
  var date=localStorage.getItem('bf_date'),days=date?Math.max(0,Math.floor((new Date()-new Date(date))/86400e3)):0;
  document.getElementById('ach-row').innerHTML=ACHS.map(function(a){
    return'<div class="ai'+(days>=a.threshold?' on':'')+'">'
      +'<span class="aico">'+a.icon+'</span>'
      +'<div><div class="anm">'+(lang==='zh'?a.zh:a.en)+'</div>'
      +'<div class="ades">'+a.threshold+'+ days</div></div></div>';
  }).join('');
}

  document.getElementById('T_name').textContent=(name||'YOU').toUpperCase();
  if(!date){daysEl.textContent=zh?'纪念日未设置':'Anniversary not set';milEl.innerHTML='';return;}
  var days=Math.max(0,Math.floor((new Date()-new Date(date))/86400e3));
  var w=Math.floor(days/7),m=Math.floor(days/30.4),y=Math.floor(days/365);
  daysEl.textContent=days.toLocaleString()+' '+(zh?'天在一起':'days together');
  milEl.innerHTML=
    (y>0?'<div class="prof-mil"><div class="prof-mil-val">'+y+'</div><div class="prof-mil-key">'+(zh?'年':y===1?'Yr':'Yrs')+'</div></div>':'')+
    (m>0?'<div class="prof-mil"><div class="prof-mil-val">'+m+'</div><div class="prof-mil-key">'+(zh?'月':m===1?'Mo':'Mos')+'</div></div>':'')+
    '<div class="prof-mil"><div class="prof-mil-val">'+w+'</div><div class="prof-mil-key">'+(zh?'周':w===1?'Wk':'Wks')+'</div></div>';
}

function cStart(){
  var vk=Object.keys(D[lang].clinic.types);
  cQ=0;cSc=0;cV={};vk.forEach(function(k){cV[k]=0;});
  document.getElementById('c-intro').style.display='none';
  document.getElementById('c-quiz').style.display='block';
  document.getElementById('c-res').style.display='none';
  cRender();
}
function cReset(){
  cQ=0;cSc=0;
  document.getElementById('c-intro').style.display='block';
  document.getElementById('c-quiz').style.display='none';
  document.getElementById('c-res').style.display='none';
  var rb=document.getElementById('T_creset');if(rb)rb.textContent=L[lang].creset;
}
function cRender(){
  var qs=D[lang].clinic.qs,q=qs[cQ];
  document.getElementById('c-phase').textContent=q.ph;
  document.getElementById('c-prog').textContent=(cQ+1)+'/'+qs.length;
  document.getElementById('c-pf').style.width=((cQ+1)/qs.length*100)+'%';
  document.getElementById('c-q').textContent=q.q;
  var d=document.getElementById('c-opts');d.innerHTML='';
  q.o.forEach(function(o){var b=document.createElement('button');b.className='co';b.textContent=o.t;b.onclick=function(){cPick(o,b);};d.appendChild(b);});
}
function cPick(o,btn){
  document.querySelectorAll('.co').forEach(function(b){b.classList.remove('sel');});btn.classList.add('sel');
  setTimeout(function(){
    if(o.s!==undefined)cSc+=o.s;
    if(o.tp!==undefined)cV[o.tp]=(cV[o.tp]||0)+1;
    cQ++;var qs=D[lang].clinic.qs;
    if(cQ<qs.length)cRender();else cResult();
  },280);
}

function cResult(){
  var cd=D[lang].clinic;
  var ang=cd.anger.find(function(a){return cSc>=a.r[0]&&cSc<=a.r[1];})||cd.anger[4];
  var tp=Object.entries(cV).sort(function(a,b){return b[1]-a[1];})[0][0];
  var ty=cd.types[tp],zh=lang==='zh';
  var bars=Array(5).fill(0).map(function(_,i){return'<div style="flex:1;height:8px;border-radius:3px;background:'+(i<ang.p?ang.bd:'rgba(255,255,255,.08)')+'"></div>';}).join('');
  var tips=ty.tips.map(function(t){return'<div class="crt" style="border-left:2px solid '+ty.ac+'"><span style="font-size:.85rem;margin-right:6px">'+t.lv+'</span><span style="font-size:.68rem;font-weight:600;color:'+ty.ac+';margin-right:4px"></span>'+t.t+'</div>';}).join('');
  var avSvg=AV_GF[tp]||ty.sv||'';
  var svgHtml=avSvg?'<div style="width:76px;margin:0 auto 10px">'+avSvg+'</div>':'';
  document.getElementById('c-res-content').innerHTML=
    '<div style="text-align:center;padding:.5rem 0 1rem">'
    +'<div style="font-size:.65rem;color:var(--muted);font-family:var(--mono);margin-bottom:6px">'+(zh?'危险等级':'Danger level')+'</div>'
    +'<div style="display:inline-block;padding:5px 16px;background:'+ang.bg+';border:0.5px solid '+ang.bd+';color:'+ang.c+';font-size:.92rem;font-weight:500;margin-bottom:5px">'+ang.n+'</div>'
    +'<div style="font-size:.75rem;color:var(--muted);margin-bottom:8px">'+ang.d+' ('+cSc+'/40 '+(zh?'分':'pts')+')</div>'
    +'<div style="display:flex;gap:4px;max-width:200px;margin:0 auto">'+bars+'</div></div>'
    +'<div style="background:'+ty.bg+';border:0.5px solid '+ty.bd+';padding:1rem;margin-bottom:1rem;text-align:center">'
    +svgHtml
    +'<div style="font-size:.65rem;color:#6b6b67;margin-bottom:3px">'+(zh?'她的性格类型':'Personality type')+'</div>'
    +'<div style="font-size:1.05rem;font-weight:500;color:'+ty.tc+';margin-bottom:5px">'+ty.n+'</div>'
    +'<div style="font-size:.78rem;color:#6b6b67;line-height:1.6;margin-bottom:8px">'+ty.d+'</div>'
    +'<div>'+ty.tg.map(function(tg){return'<span class="etag" style="background:'+ty.bg+';border:0.5px solid '+ty.bd+';color:'+ty.tc+'">'+tg+'</span>';}).join('')+'</div></div>'
    +'<div style="font-size:.65rem;color:var(--muted);font-family:var(--mono);margin-bottom:7px">'+(zh?'专属补救方案':'Recovery plan')+'</div>'
    +tips
    +'<div style="text-align:center;padding:.8rem 0 .3rem;font-size:.7rem;color:rgba(255,255,255,.18)">'+(zh?'加油，你可以的 ❤':'You\'ve got this. ❤')+'</div>';
  document.getElementById('c-quiz').style.display='none';
  document.getElementById('c-res').style.display='block';
  document.getElementById('T_creset').textContent=L[lang].creset;
}
