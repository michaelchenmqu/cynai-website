<style>
:root{--bg:#0d0608;--border:rgba(255,107,157,.15);--pink:#ff6b9d;--rose:#ff3b6e;--blush:#ffb3cc;--gold:#ffd700;--text:#f5e6ec;--muted:#8a6b76;--serif:'Playfair Display',Georgia,serif;--serif-cn:'Noto Serif SC','Playfair Display',serif;--body:'DM Sans',sans-serif;--mono:'Share Tech Mono',monospace}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;overflow-x:hidden;padding-bottom:40px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 70% 20%,rgba(255,107,157,.07) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 20% 80%,rgba(255,59,110,.05) 0%,transparent 60%);pointer-events:none;z-index:0}
.topbar{position:sticky;top:0;z-index:100;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(13,6,8,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.back-link{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;color:var(--muted);text-decoration:none;transition:color .2s}
.back-link:hover{color:var(--pink)}
.topbar-title{font-family:var(--serif);font-size:.95rem;font-style:italic;color:var(--pink)}
.lang-toggle{display:flex;background:rgba(255,255,255,.04);border:0.5px solid var(--border);border-radius:20px;overflow:hidden}
.lang-btn{background:none;border:none;font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;padding:4px 11px;cursor:pointer;color:rgba(255,107,157,.4);transition:all .2s}
.lang-btn.active{background:rgba(255,107,157,.18);color:var(--pink)}
.container{max-width:720px;margin:0 auto;padding:20px 24px;display:flex;flex-direction:column;gap:18px}
@media(min-width:900px){.container{max-width:960px}}
.sec-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);margin-bottom:10px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.sec-label::before{content:'';display:block;width:14px;height:1px;background:var(--pink)}
/* Profile block at top */
.prof-block{background:rgba(255,107,157,.05);border:1px solid rgba(255,107,157,.2);border-radius:10px;padding:14px 18px}
.prof-main{display:flex;align-items:center;justify-content:space-between;gap:12px}
.prof-left{display:flex;align-items:center;gap:14px}
.prof-avatar{width:46px;height:46px;border-radius:50%;background:rgba(255,107,157,.15);border:1.5px solid rgba(255,107,157,.35);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.prof-name{font-size:16px;font-weight:600;color:var(--text);line-height:1.2;white-space:nowrap}
.prof-days{font-family:var(--mono);font-size:.68rem;color:rgba(255,107,157,.55);letter-spacing:.06em;margin-top:3px;white-space:nowrap}
.prof-milestones{display:flex;gap:14px;flex-wrap:nowrap}
.prof-mil{text-align:center}
.prof-mil-val{font-family:var(--serif);font-size:1.2rem;font-weight:700;color:var(--blush);line-height:1}
.prof-mil-key{font-family:var(--mono);font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prof-edit-btn{font-family:var(--mono);font-size:.65rem;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,107,157,.4);background:none;border:0.5px solid rgba(255,107,157,.2);padding:5px 12px;cursor:pointer;transition:all .2s;white-space:nowrap;border-radius:3px}
.prof-edit-btn:hover{border-color:var(--pink);color:var(--pink)}
.prof-edit-form{margin-top:14px;padding-top:14px;border-top:0.5px solid var(--border);display:flex;flex-direction:column;gap:10px}
.prof-field{display:flex;flex-direction:column;gap:4px}
.prof-field label{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.prof-field input{background:rgba(255,107,157,.04);border:1px solid var(--border);color:var(--text);font-family:var(--body);font-size:.9rem;padding:9px 12px;outline:none;transition:border-color .2s}
.prof-field input:focus{border-color:var(--pink)}
.prof-save-btn{align-self:flex-start;font-family:var(--mono);font-size:.67rem;letter-spacing:.08em;text-transform:uppercase;background:var(--pink);color:var(--bg);border:none;padding:9px 20px;cursor:pointer;transition:background .2s}
.prof-save-btn:hover{background:var(--rose)}
/* Message */
.greeting-date{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;color:rgba(255,107,157,.35);text-transform:uppercase;margin-bottom:10px}
.message-card{background:rgba(255,107,157,.04);border:1px solid rgba(255,107,157,.15);padding:18px 20px;position:relative;overflow:hidden;border-radius:8px}
.message-card::before{content:'"';position:absolute;top:4px;left:12px;font-family:var(--serif);font-size:4.5rem;font-style:italic;color:rgba(255,107,157,.06);line-height:1;pointer-events:none}
.message-text{font-size:1.05rem;font-style:italic;line-height:1.7;color:var(--text);position:relative;z-index:1;margin-bottom:10px}
.lang-zh .message-text{font-family:var(--serif-cn)}
.lang-en .message-text{font-family:var(--serif)}
.message-tag{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--muted)}
/* Features */
.features-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:700px){.features-grid{grid-template-columns:repeat(4,1fr)}}
.feat-card{background:rgba(255,107,157,.03);border:1px solid var(--border);padding:16px;transition:border-color .2s,background .2s;cursor:pointer;border-radius:6px}
.feat-card:hover{border-color:rgba(255,107,157,.3);background:rgba(255,107,157,.06)}
.feat-icon{font-size:1.5rem;margin-bottom:8px;display:block}
.feat-title{font-size:.92rem;color:rgba(255,230,236,.75);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang-zh .feat-title{font-family:var(--serif-cn)}
.feat-result{font-size:.88rem;font-style:italic;color:var(--blush);line-height:1.6;padding:9px 12px;border-left:2px solid rgba(255,107,157,.25);background:rgba(255,107,157,.05);display:none;margin-top:8px;border-radius:0}
.lang-zh .feat-result{font-family:var(--serif-cn);font-style:normal}
.feat-result.show{display:block}
.feat-btn{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid rgba(255,107,157,.3);color:var(--pink);padding:8px 14px;cursor:pointer;transition:all .2s;margin-top:10px;width:100%}
.feat-btn:hover{background:var(--pink);color:var(--bg)}
/* Notes */
.notes-section{display:flex;flex-direction:column;gap:0}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-bottom:10px}
.note-item{background:rgba(255,107,157,.04);border:1px solid rgba(255,107,157,.1);padding:12px;font-size:.9rem;font-style:italic;color:var(--blush);line-height:1.5;position:relative}
.lang-zh .note-item{font-family:var(--serif-cn);font-style:normal}
.note-delete{position:absolute;top:4px;right:6px;background:none;border:none;cursor:pointer;font-size:.65rem;color:var(--muted);padding:2px 4px;transition:color .2s}
.note-delete:hover{color:var(--rose)}
.note-empty{color:var(--muted);font-size:.85rem;padding:4px 0}
.note-input-row{display:flex;gap:8px}
.note-input{flex:1;background:rgba(255,107,157,.04);border:1px solid var(--border);color:var(--text);font-family:var(--serif);font-size:.92rem;font-style:italic;padding:10px 14px;outline:none;transition:border-color .2s}
.lang-zh .note-input{font-family:var(--serif-cn);font-style:normal}
.note-input:focus{border-color:var(--pink)}
.note-add-btn{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;background:var(--pink);color:var(--bg);border:none;padding:10px 16px;cursor:pointer;transition:background .2s;white-space:nowrap}
.note-add-btn:hover{background:var(--rose)}
::placeholder{color:rgba(255,255,255,.15)}
/* Emergency */
.emergency-divider{display:flex;align-items:center;gap:10px}
.divider-line{flex:1;height:0.5px;background:rgba(255,59,110,.2)}
.divider-label{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,59,110,.5);white-space:nowrap}
/* Clinic */
.clinic-section{background:rgba(255,59,110,.06);border:1px solid rgba(255,59,110,.25);padding:20px;border-radius:8px}
.clinic-intro{text-align:center;padding:6px 0 4px}
.clinic-icon-wrap{width:56px;height:56px;border-radius:50%;background:#E6F1FB;border:0.5px solid #85B7EB;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.clinic-title{font-family:var(--mono);font-size:1rem;font-weight:600;letter-spacing:.04em;color:var(--text);margin-bottom:6px}
.clinic-sub{font-size:.88rem;color:var(--muted);margin-bottom:4px;line-height:1.5}
.lang-zh .clinic-sub{font-family:var(--serif-cn)}
.clinic-sub2{font-size:.75rem;color:rgba(255,255,255,.22);margin-bottom:18px}
.clinic-start-btn{font-family:var(--mono);font-size:.82rem;letter-spacing:.06em;background:var(--rose);color:#fff;border:none;padding:12px 36px;cursor:pointer;transition:all .2s;border-radius:4px}
.clinic-start-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,59,110,.3)}
.clinic-progress-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-bottom:6px}
.clinic-pb{height:3px;background:rgba(255,59,110,.12);border-radius:2px;margin-bottom:14px}
.clinic-pf{height:100%;border-radius:2px;background:var(--rose);transition:width .3s}
.clinic-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,59,110,.15);padding:16px;border-radius:6px}
.clinic-question{font-size:.95rem;font-weight:500;margin-bottom:14px;line-height:1.65;color:var(--text)}
.lang-zh .clinic-question{font-family:var(--serif-cn)}
.clinic-opt{display:block;width:100%;text-align:left;padding:10px 14px;margin:5px 0;border:0.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:var(--text);font-size:.88rem;cursor:pointer;line-height:1.5;font-family:var(--body);transition:all .15s;border-radius:4px}
.lang-zh .clinic-opt{font-family:var(--serif-cn)}
.clinic-opt:hover{background:rgba(255,59,110,.08);border-color:rgba(255,59,110,.3)}
.clinic-opt.sel{background:rgba(255,59,110,.12);border-color:var(--rose);color:#ffb3cc}
.clinic-reset-btn{width:100%;padding:11px;margin-top:14px;border:0.5px solid rgba(255,255,255,.12);background:transparent;font-size:.85rem;cursor:pointer;color:var(--muted);font-family:var(--body);transition:background .2s;border-radius:4px}
.lang-zh .clinic-reset-btn{font-family:var(--serif-cn)}
.clinic-reset-btn:hover{background:rgba(255,255,255,.04)}
.clinic-result-tip{padding:10px 14px;margin:5px 0;font-size:.88rem;line-height:1.65;color:var(--text);background:rgba(255,255,255,.04);border-radius:4px}
.lang-zh .clinic-result-tip{font-family:var(--serif-cn)}
.ec-tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.68rem;font-weight:500;margin:3px}
.app-footer{text-align:center;padding:24px 0 8px;border-top:1px solid var(--border)}
.app-footer a{color:var(--pink);text-decoration:none;font-family:var(--mono);font-size:.68rem}
.app-footer span{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
@media(max-width:600px){.container{padding:16px 16px}.features-grid{grid-template-columns:1fr 1fr}.note-input-row{flex-direction:column}.prof-milestones{display:none}.prof-main{flex-wrap:wrap}}
</style>
</head>

    questions:[
        {ph:'Anger level',q:'What actually triggered this?',o:[{t:'😬 Foot-in-mouth moment — said something I instantly regretted',s:1},{t:'😞 Forgot / cancelled / dropped the ball on something he’d told me about',s:2},{t:'💥 A proper argument broke out — both of us said things',s:3},{t:'😤 He was already stressed and I accidentally made it worse',s:2},{t:'🤷 Genuinely no idea. The vibe just shifted and I don’t know why.',s:3}]},
        {ph:'Anger level',q:'How did things end when you last saw/spoke?',o:[{t:'👋 A bit stiff but a proper goodbye happened',s:1},{t:'😶 He went quiet, said nothing meaningful, and left',s:2},{t:'🚶 Walked out without looking back',s:3},{t:'📵 I barely registered him going — he was just gone',s:4},{t:'🫤 Said bye but you could both feel something wasn’t right',s:2}]},
        {ph:'Anger level',q:'After you parted, his first message was?',o:[{t:'💬 Casual — as if nothing had happened',s:1},{t:'🧊 Functional only — "home" / "ok" / nothing personal',s:2},{t:'⏳ Nothing yet, but I haven’t texted either',s:2},{t:'😶 Nothing — I went first and he hasn’t replied',s:3},{t:'📵 Nothing — the message didn’t even deliver',s:4}]},
        {ph:'Anger level',q:'You reached out first — what happened?',o:[{t:'💬 He replied, just shorter and colder than usual',s:1},{t:'🗿 One word: "ok" / "mm" / "sure" — technically counts',s:2},{t:'👀 He read it. That’s it.',s:3},{t:'🔇 Replying to others but not to me',s:3},{t:'📵 Nothing. Possibly blocked.',s:4}]},
        {ph:'Anger level',q:'His social media and general presence since?',o:[{t:'📱 Normal — nothing suspicious',s:1},{t:'🎮 Posting sports/gaming/gym — venting physically',s:2},{t:'😶 Gone completely quiet — no activity anywhere',s:3},{t:'🔒 Active but I’ve been set to restricted',s:4},{t:'🤝 Normal with everyone except specifically me',s:3}]},
        {ph:'Anger level',q:'When you’ve seen or spoken to him in person?',o:[{t:'😐 Cool but not actively avoiding me',s:1},{t:'📱 Present but distracted — phone, very short answers',s:2},{t:'👁️ Barely making eye contact',s:3},{t:'🚪 Haven’t been able to — he’s suddenly very "busy"',s:3},{t:'💀 We saw each other. It was not good.',s:4}]},
        {ph:'Anger level',q:'His friends — has their attitude to you changed?',o:[{t:'🤷 No change — he probably hasn’t said anything',s:1},{t:'😐 One friend has been a bit off lately',s:2},{t:'❄️ His close group has visibly gone cooler on me',s:3},{t:'🚫 Multiple people in his circle suddenly very "busy"',s:4},{t:'🤝 No change — they actually seem to be on my side',s:1}]},
        {ph:'Anger level',q:'You apologised — what happened?',o:[{t:'✅ Yes — "it’s fine" in the least fine voice I’ve ever heard',s:1},{t:'🤐 Yes — he said "I know" then went very quiet',s:2},{t:'💀 Yes — what he said back ended the conversation',s:3},{t:'⏳ Not yet — can’t find the right moment',s:2},{t:'🤝 We talked — better than before but not fully resolved',s:1}]},
        {ph:'Anger level',q:'Honestly, how bad is this?',o:[{t:'🙂 Minor — a friend outside this would say I’m overthinking',s:1},{t:'😬 Real, but understandable — most people would get it',s:2},{t:'😤 Genuinely serious — I know I got this wrong',s:3},{t:'🤷 Unknown — I genuinely can’t tell if I did anything wrong',s:2},{t:'💀 Bad enough that I’m scared to push further',s:4}]},
        {ph:'Anger level',q:'The last thing he said to you was?',o:[{t:'😶 "It’s fine" or just walked away without a word',s:1},{t:'😑 "Think about what you did"',s:2},{t:'🧊 "Whatever" / "do what you want" — that flat cold tone',s:3},{t:'💀 Something that ended any further conversation',s:4},{t:'🤐 Nothing. Just silence. Which is somehow the worst of all.',s:4}]},
        {ph:'Reading his type',q:'When he’s genuinely upset, what’s his style?',o:[{t:'🗿 Full silent treatment — shuts down and waits for you to come',tp:'C'},{t:'💢 Says what’s on his mind, sometimes loudly',tp:'A'},{t:'🎮 Vanishes into sport / gaming / work — anything but dealing with it',tp:'E'},{t:'😊 Carries on acting totally "fine" — suspiciously, unnervingly fine',tp:'D'},{t:'🧮 Gets very calm and starts making very logical precise points',tp:'K'}]},
        {ph:'Reading his type',q:'What has actually worked to reach him before?',o:[{t:'🍜 Food — his favourite meal makes him a completely different person',tp:'H'},{t:'🤍 You going first — reaching out, being soft, showing you care',tp:'B'},{t:'😂 Making him laugh — humour reliably breaks through',tp:'C'},{t:'💬 A proper honest calm conversation — no drama, just talking',tp:'A'},{t:'⏰ Time — he always comes around on his own eventually',tp:'J'}]},
        {ph:'Reading his type',q:'His energy right now is closest to?',o:[{t:'🏃 Active — physically venting through exercise, driving, movement',tp:'E'},{t:'🔇 Quiet and withdrawn — at home, scrolling or staring at nothing',tp:'C'},{t:'🍺 Out socialising — posting photos, apparently having a great time',tp:'F'},{t:'💼 Work mode — professional, focused, and very unavailable',tp:'I'},{t:'🌀 Honestly hard to read — shifts every hour',tp:'D'}]},
        {ph:'Reading his type',q:'When you give him a gift or do something thoughtful, he?',o:[{t:'🤨 Says "what’s this for?" — but definitely keeps it and tells people',tp:'C'},{t:'😊 Gets genuinely excited and enthusiastic — tells everyone',tp:'D'},{t:'🔬 Immediately asks where you got it and exactly how much it cost',tp:'K'},{t:'💪 Just starts using it right away — action is his version of thanks',tp:'E'},{t:'😶 Doesn’t say much. But you can feel the shift in him afterward.',tp:'G'}]},
        {ph:'Reading his type',q:'When stressed about something unrelated to you, he?',o:[{t:'🏋️ Physically vents — gym, run, any sport',tp:'E'},{t:'👨‍💻 Goes deep into work or a solo project',tp:'K'},{t:'🍻 Calls the group — needs his people around him',tp:'F'},{t:'🎮 Games until late — goes offline from everything else',tp:'C'},{t:'🤐 Disappears quietly and processes it alone',tp:'I'}]},
        {ph:'Reading his type',q:'His relationship with food when he’s feeling low?',o:[{t:'🍕 Food is medicine — his favourite meal genuinely fixes things',tp:'H'},{t:'🤷 Doesn’t really use food for emotional comfort',tp:'K'},{t:'🏃 Eats as fuel, doesn’t think emotionally about it',tp:'E'},{t:'🍱 Eats normally — nothing dramatic about it',tp:'J'},{t:'🤩 Has very specific comfort food, gets really particular about it',tp:'H'}]},
        {ph:'Reading his type',q:'In the relationship, he’s more of a?',o:[{t:'📞 Initiator — usually the one who reaches out first',tp:'A'},{t:'📱 Responder — replies well but rarely starts conversations',tp:'J'},{t:'🎯 Planner — likes to organise, take charge, lead decisions',tp:'B'},{t:'🌡️ Connector — checks in on everyone, not just you',tp:'D'},{t:'🔇 Presence person — deeply there when present, needs his space',tp:'C'}]},
        {ph:'Reading his type',q:'A week from now, how will he have processed this?',o:[{t:'🤝 Talked it through and moved on genuinely',tp:'A'},{t:'⏳ Still quietly carrying it, but won’t bring it up',tp:'J'},{t:'📊 Wants to understand exactly why it happened and prevent it recurring',tp:'K'},{t:'🔥 Vented to friends and already moved on',tp:'F'},{t:'😏 Acting fine — but will reference this moment in six months',tp:'G'}]},
        {ph:'Reading his type',q:'When you are upset or struggling, he?',o:[{t:'🤍 Drops everything and immediately tries to fix the problem',tp:'B'},{t:'💬 Sits with you, lets you talk, actually listens',tp:'A'},{t:'🍜 Gets you food — feeding you is how he shows love',tp:'H'},{t:'🤷 Doesn’t always notice — not the most emotionally tuned-in',tp:'E'},{t:'🧮 Tries to solve the issue logically rather than emotionally',tp:'K'}]},
        {ph:'Reading his type',q:'His life philosophy is closest to?',o:[{t:'💬 "Say what you think. Life’s too short for hints and games."',tp:'A'},{t:'🏆 "I lead. Others follow. That’s just how it tends to work."',tp:'B'},{t:'🧊 "I’m an open book — to exactly one person at a time."',tp:'C'},{t:'🌡️ "Everyone deserves warmth. I have more than enough to share."',tp:'D'},{t:'🎯 "Talk less, do more. Actions are what actually count."',tp:'E'}]}
      ],
      anger:[
        {n:'Just a little grumpy',d:'Just started — totally fixable with quick action',r:[10,16],p:1,bg:'#EAF3DE',bd:'#97C459',c:'#3B6D11'},
        {n:'Cold war mode',d:'Getting serious — needs genuine effort now',r:[17,22],p:2,bg:'#E6F1FB',bd:'#85B7EB',c:'#0C447C'},
        {n:'Stone-cold & frozen',d:'His silence is the deepest anger',r:[23,28],p:3,bg:'#FAEEDA',bd:'#EF9F27',c:'#854F0B'},
        {n:'Emotional shutdown',d:'High risk — normal tactics won’t work',r:[29,34],p:4,bg:'#FCEBEB',bd:'#F09595',c:'#A32D2D'},
        {n:'Door fully closed',d:'Full crisis — needs sincerity and miracles',r:[35,40],p:5,bg:'#FCEBEB',bd:'#E24B4A',c:'#791F1F'}
      ],
      types:{
        A:{n:'Direct & Upfront',d:'Says exactly what he thinks, no cold wars. Angry = angry. Fast apology = fast forgiveness.',tg:['Straight talker','No cold wars','Apologise and it’s done'],bg:'#FAECE7',bd:'#F0997B',tc:'#993C1D',ac:'#D85A30',tips:[{lv:'🧋 Easy',t:'Just say "I was wrong" — no explanation, no excuses. Three words. That’s all he wants.'},{lv:'🎁 Gift',t:'Buy what he’s always wanted but won’t get himself. Direct types love actual action.'},{lv:'💸 Bigger',t:'Take him to dinner at his favourite place. Proper apology at the table.'},{lv:'🏬 Serious',t:'Take him wherever he’s always wanted to go. No negotiating. He’ll forgive you there and then.'},{lv:'💀 Nuclear',t:'Apologise in front of his friends — direct types care about face. This breaks him completely.'}]},
        B:{n:'Dominant Type',d:'Needs to lead everything, strong presence. Punishes with coldness. He’s been waiting for you to yield.',tg:['Needs control','Cold as a weapon','Yield first'],bg:'#2C2C2A',bd:'#444441',tc:'#F1EFE8',ac:'#888780',tips:[{lv:'🤍 Posture',t:'Go to him first. First words must be soft — he’s been waiting for this and won’t admit it.'},{lv:'🎁 Quality',t:'Send something high quality — not cheap. He notices.'},{lv:'💸 Bigger',t:'Book somewhere nice. He needs to feel you’re taking this seriously.'},{lv:'🏬 Serious',t:'Let him plan everything today. Full control. That’s what he needs back.'},{lv:'💀 Nuclear',t:'Get on your knees and apologise (seriously). Works every time. He can’t resist this.'}]},
        C:{n:'Cool Outside, Wild Inside',d:'Stone-faced in public. Sends memes privately that destroy you. His face gets colder but he’s reading your chats.',tg:['Ice cold outside','Meme lord inside','Still checking your chats'],bg:'#EEEDFE',bd:'#AFA9EC',tc:'#26215C',ac:'#534AB7',tips:[{lv:'🧊 Break ice',t:'Send your private meme, say nothing. He’ll fight back a laugh and lose. Laughing = he’s yours again.'},{lv:'🤫 Private only',t:'Only reach out in private — he needs your two-person space to soften, not a public scene.'},{lv:'🎁 Absurd gift',t:'Give him something ridiculous but thoughtful. Surface reaction: "what is this." Reality: already saved it.'},{lv:'💸 Bigger',t:'Take him somewhere private. He becomes a completely different, warmer person when no one’s watching.'},{lv:'💀 Nuclear',t:'Screenshot his wildest private meme and send it back: "this is the real you." He’ll combust then forgive you.'}]},
        D:{n:'Central Heating',d:'Warm to absolutely everyone. Still warm when angry. You can’t even tell he’s upset.',tg:['Warm to everyone','Hard to read','Needs to feel special'],bg:'#E1F5EE',bd:'#5DCAA5',tc:'#04342C',ac:'#0F6E56',tips:[{lv:'🌡️ Check temp',t:'Ask him directly: "are you actually upset?" He’ll say no. Don’t believe him.'},{lv:'🎯 Exclusive',t:'Do something just for him — not your usual care. He needs to feel he’s the one that’s different.'},{lv:'🎁 Private meaning',t:'Give something only you two understand. Private significance breaks him immediately.'},{lv:'💸 Bigger',t:'Do something he’s never done with anyone else. Exclusive memory. This is what he needs.'},{lv:'💀 Nuclear',t:'"You’re this warm to everyone — how do I know you actually like me?" He’ll spend ages proving it.'}]},
        E:{n:'Action Man',d:'Bad with words, tremendous with action. Vents through sport and exercise. Practical gestures get instant forgiveness.',tg:['Action over words','Rough but warm','Practical beats romantic'],bg:'#FAEEDA',bd:'#EF9F27',tc:'#633806',ac:'#BA7517',tips:[{lv:'🏃 Join him',t:'Go to his sport or workout — even if you’re bad at it. Showing up is the whole point.'},{lv:'🍖 Feed him',t:'Order big, hearty food. Nothing refined. He likes things real.'},{lv:'🎁 Practical',t:'Something practical for his hobby. Action types don’t respond to useless romance.'},{lv:'💸 Bigger',t:'Buy the gear he’s been putting off. Don’t ask — just buy it.'},{lv:'💀 Nuclear',t:'Solve the most stressful thing on his plate right now. Say nothing. Just do it. He’ll know.'}]},
        F:{n:'Social Battery',d:'Needs friends and energy. Went to find his people when upset. You need to pull him back.',tg:['Friends are medicine','Noise heals','Pull him back to win'],bg:'#EAF3DE',bd:'#97C459',tc:'#173404',ac:'#3B6D11',tips:[{lv:'🧋 Show up',t:'Text "where are you, I’m coming." Show up in his social space. Your presence is the gesture.'},{lv:'🍻 Group plan',t:'Invite him and his friends out. The noise dilutes bad feelings. Apologise alone after.'},{lv:'🎁 For his circle',t:'Something for his current hobby or social life — show you understand his world.'},{lv:'💸 Bigger',t:'Shout the whole crew dinner. Pay generously. Social types absolutely love this.'},{lv:'💀 Nuclear',t:'Organise an event he and his friends will love. He’ll think "she really gets me."'}]},
        G:{n:'Detail Guy',d:'Rough exterior, incredibly fine-tuned interior. He remembers everything you’ve ever said and will use it.',tg:['Looks rough, feels deep','Remembers everything','Being remembered moves him'],bg:'#FBEAF0',bd:'#ED93B1',tc:'#4B1528',ac:'#993556',tips:[{lv:'💬 Reference him',t:'Dig up a message he sent and bring it back. He’s most moved when you remember something he said.'},{lv:'🎁 That one thing',t:'Give him something he mentioned once that you remembered. He will genuinely break down (in a good way).'},{lv:'💸 Bigger',t:'Take him somewhere he hinted at once, once only. He’ll act calm. He already forgave you.'},{lv:'🏬 Handle it',t:'Sort something he keeps mentioning but hasn’t done. He’ll say "how did you even remember that."'},{lv:'💀 Nuclear',t:'List every little thing he’s said since you’ve been together. He’ll freeze, then completely crumble.'}]},
        H:{n:'Food Lover',d:'Food solves 70% of his bad moods. The other 30% is also food. That’s just how he’s built.',tg:['Food is everything','Fed = forgiving','Stomach is the shortcut'],bg:'#FAECE7',bd:'#F0997B',tc:'#993C1D',ac:'#D85A30',tips:[{lv:'🧋 Right now',t:'Order his absolute favourite delivery. Now. Large portion. Let food speak first.'},{lv:'🍖 Cook it',t:'Make or buy his favourite dish. Put it in front of him. His mood improves by half.'},{lv:'🎁 Snack haul',t:'A big variety of his favourite snacks. Being cared for through food softens him every time.'},{lv:'💸 The restaurant',t:'Book the place he’s always talked about. Tonight. However expensive or inconvenient.'},{lv:'💀 Nuclear',t:'"You decide everything we eat today. I’m paying." Watch him slowly, visibly melt.'}]},
        I:{n:'Proud Underdog',d:'Sky-high ego, really cares about face. Won’t speak first even when dying to. Needs to feel understood.',tg:['Self-esteem is his core','Refuses to go first','Being seen = total meltdown'],bg:'#F1EFE8',bd:'#B4B2A9',tc:'#2C2C2A',ac:'#5F5E5A',tips:[{lv:'🤍 Give face',t:'Never embarrass him in public. Apologise privately, serious tone, no games.'},{lv:'🎁 Level up',t:'Something that makes him feel he’s improving or growing. He’s deeply invested in progress.'},{lv:'💸 Bigger',t:'Nice dinner. Tell him sincerely what you admire about him. He’ll act calm. He’s not.'},{lv:'🏬 Deliver',t:'Help him get something he’s always wanted but hasn’t had the means for. Let him feel supported.'},{lv:'💀 Nuclear',t:'"I think you’re incredible — this was my fault." He crumbles the moment he feels genuinely seen.'}]},
        J:{n:'Slow & Chill',d:'Unbothered pace. Emotions arrive slowly, leave slowly. Won’t explode but his cold can last a very long time.',tg:['Can’t be rushed','No drama','But remembers everything'],bg:'#E6F1FB',bd:'#85B7EB',tc:'#042C53',ac:'#185FA5',tips:[{lv:'⏳ Time',t:'Give him time. Pushing him only slows things down. Patience is the only strategy.'},{lv:'🍱 Food delivery',t:'Send food, say nothing. Just let him know you’re still there.'},{lv:'🎁 Low-key',t:'Something practical and thoughtful. Nothing over the top — he responds to understated warmth.'},{lv:'💸 When ready',t:'Once he’s cooled, invite him out to eat. He’ll open up at the table.'},{lv:'💀 Nuclear',t:'Do one small thing every day without expecting response. He will one day say "I’m fine now."'}]},
        K:{n:'Logic Bro',d:'Razor-sharp logic, bad with emotions. When upset, needs an "effective solution." Romance is completely useless here.',tg:['Logic first always','Needs a solution','Romance: does not compute'],bg:'#EEEDFE',bd:'#AFA9EC',tc:'#26215C',ac:'#534AB7',tips:[{lv:'📝 Be logical',t:'Explain cause and effect clearly. No "I just felt." Use "because... therefore..." — he needs logic.'},{lv:'📊 Be specific',t:'Exactly what went wrong, why it happened, what the plan is to fix it. More detail = more effective.'},{lv:'☕ Sit down',t:'Book time to work through it properly. He likes solving problems. Don’t avoid this.'},{lv:'💸 Practical gift',t:'Something with a clear, practical function. Bonus points if you can explain exactly why you chose it.'},{lv:'💀 Nuclear',t:'Write a formal apology letter — logical structure, problem analysis, improvement plan. He’ll read it multiple times then forgive you.'}]}
      }
    }
  },
  zh:{
    messages:["喜欢你，是我这辈子做得最对的一件事。","遇见你之前，我不相信缘分。遇见你之后，我开始相信了。","你知道吗？我每天第一个想到的人都是你。","有你在的地方，就是我想去的地方。","我想把每一个好消息都第一个告诉你。","你不需要做什么，只是存在着，就已经是我的全部。","希望今天有人对你说：你今天真的很好看。（就是我。）","跟你在一起的每一天，都是我这一年里最好的日子。","你笑起来真的很好看，我可以看一辈子。","世界这么大，我只想牵着你的手走。","偷偷爱你很久了。嗯，就是这样。","不管走到哪里，你都是我最想回头找的那个人。","喜欢你不需要理由，但如果要说，那就是你的一切。","你是我迄今为止最正确的选择。","有你的日子，连普通的星期三都变得特别起来。","我愿意用很多年，只为换你一个笑。","今天也很喜欢你，昨天也是，明天也会是。","只要是和你有关的事，我都想多知道一点。","你是我的答案，也是我的问题。","爱你这件事，我想做一辈子。"],
    lovePhrases:["你的眼睛里有星星，我一直以为那是光，后来才知道，那是你在对我笑。","如果可以，我想把余生的每一个早安都说给你听。","世界上最浪漫的距离，就是我伸手就能碰到你。","你笑起来的样子，比我见过的所有风景都好看。","我爱你，不只是因为你的样子，也因为和你在一起时我的样子。","喜欢一个人，就是把最好的早晨留给她。","你是我在这个世界上，最不想失去的那种存在。","认识你之后，我开始期待每一个明天。","最近发现了一件事：你在，哪里都是好地方。","想一直这样陪着你，慢慢变老。","如果有下辈子，我还想认识你，还想喜欢你。","你知道我最幸福的时候是什么时候吗？就是现在，每一个现在。"],
    convos:["如果可以去任何地方旅行，你最想去哪里？我来安排。","你最近有什么小秘密还没跟我说？","你这周最开心的一件事是什么？","如果今晚可以做任何事，你想做什么？","你有没有什么一直想跟我说但没说出口的话？","我们认识以来，你最喜欢哪个时刻？","你觉得我哪一点让你最意外？","如果我们明天可以消失一天，你想去哪里做什么？","你觉得爱情对你来说最重要的是什么？","最近有什么东西让你特别感动？","你最近有没有特别想实现的一件小事？","你现在最想被怎么对待？"],
    gifts:["她最爱的奶茶，大杯，全糖，不问直接点——这才叫了解。","一束鲜花，不一定贵，但要好看，要配得上她。","她一直在看的那条裙子或包包——你悄悄买了直接送到。","一套护肤品或香水——选她喜欢的香，不会选就问她闺蜜。","口红，选她常用的色号——你记得色号这件事本身就是最好的礼物。","定制一样专属的东西——印着你们名字或纪念日的小物件。","拍立得相纸，冲洗你们最好的一张合照——比任何礼物都有记忆感。","陪她去一次她一直想去的展览、音乐会或者电影。","手链，选她常戴的风格——细节说明你在认真看她。","奶茶 + 零食 + 手写小纸条组成的惊喜礼物盒——直接破防。","给她买一本她最爱的作家的新书，夹一张手写书签。","提前订好她生日想去的餐厅，不用她说，你已经安排好了。"],

// ── CLINIC STATE ──
var cQ=0,cSc=0,cV={};

// ── HELPERS ──
function dayOfYear(){var n=new Date();return Math.floor((n-new Date(n.getFullYear(),0,0))/86400000)}
function seeded(arr,seed){return arr[seed%arr.length]}
function rnd(arr){return arr[Math.floor(Math.random()*arr.length)]}

// ── LANGUAGE ──
function setLang(l){
  lang=l;
  localStorage.setItem('gf_lang',l);
  document.body.className='lang-'+l;
  document.getElementById('btn-en').className='lang-btn'+(l==='en'?' active':'');
  document.getElementById('btn-zh').className='lang-btn'+(l==='zh'?' active':'');
  render();
  clinicReset();
}

// ── MAIN RENDER ──
function render(){
  var t=L[lang],d=D[lang];
  var now=new Date();
  document.getElementById('topbar-title').textContent=t.title;
  document.getElementById('today-date').textContent=now.toLocaleDateString(lang==='zh'?'zh-CN':'en-AU',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('msg-label').textContent=t.msgLabel;
  document.getElementById('daily-msg').textContent=seeded(d.messages,dayOfYear());
  document.getElementById('msg-tag').textContent=t.msgTag;
  document.getElementById('feat-section-label').textContent=t.featLabel;
  renderFeatures();
  document.getElementById('notes-label').textContent=t.notesLabel;
  document.getElementById('note-input').placeholder=t.notePlaceholder;
  document.getElementById('note-add-btn').textContent=t.noteAddBtn;
  document.getElementById('name-field-label').textContent=t.nameFieldLabel;
  document.getElementById('date-field-label').textContent=t.dateFieldLabel;
  document.getElementById('save-profile-btn').textContent=t.saveProfileBtn;
  document.getElementById('emergency-label').textContent=t.emergencyLabel;
  document.getElementById('clinic-title').textContent=t.clinicTitle;
  document.getElementById('clinic-sub').textContent=t.clinicSub;
  document.getElementById('clinic-sub2').textContent=t.clinicSub2;
  document.getElementById('clinic-start-btn').textContent=t.clinicStartBtn;
  document.getElementById('footer-text').textContent=t.footerText;
  renderProfile();
  renderNotes();
}

function renderFeatures(){
  var t=L[lang],d=D[lang];
  var feats=lang==='en'?[d.affirmations,d.questions,d.loveReasons,d.dateIdeas]:[d.lovePhrases,d.convos,d.gifts,d.dates];
  var g=document.getElementById('features-grid');
  g.innerHTML=t.featIcons.map(function(ic,i){
    return '<div class="feat-card" onclick="toggleFeat('+i+')">'
      +'<span class="feat-icon">'+ic+'</span>'
      +'<div class="feat-title">'+t.featTitles[i]+'</div>'
      +'<div class="feat-result" id="fr-'+i+'"></div>'
      +'<button class="feat-btn" onclick="event.stopPropagation();genFeat('+i+')">'+t.featBtns[i]+'</button>'
      +'</div>';
  }).join('');
  window._featData=feats;
}

function genFeat(i){
  var arr=window._featData[i];
  var el=document.getElementById('fr-'+i);
  el.textContent=rnd(arr);
  el.classList.add('show');
}
function toggleFeat(i){
  var el=document.getElementById('fr-'+i);
  if(!el.classList.contains('show'))genFeat(i);
}

// ── NOTES ──
function addNote(){
  var inp=document.getElementById('note-input'),txt=inp.value.trim();
  if(!txt)return;
  var notes=JSON.parse(localStorage.getItem('gf_notes')||'[]');
  notes.unshift({text:txt,id:Date.now()});
  localStorage.setItem('gf_notes',JSON.stringify(notes));
  inp.value='';renderNotes();
}
function deleteNote(id){
  var notes=JSON.parse(localStorage.getItem('gf_notes')||'[]').filter(function(n){return n.id!==id});
  localStorage.setItem('gf_notes',JSON.stringify(notes));renderNotes();
}
function renderNotes(){
  var notes=JSON.parse(localStorage.getItem('gf_notes')||'[]');
  var g=document.getElementById('notes-grid');
  if(!notes.length){g.innerHTML='<div class="note-empty">'+(lang==='zh'?'你的悄悄话会出现在这里…':'Your love notes will appear here...')+'</div>';return;}
  g.innerHTML=notes.map(function(n){return'<div class="note-item">'+n.text+'<button class="note-delete" onclick="deleteNote('+n.id+')">✕</button></div>';}).join('');
}

// ── PROFILE (top block) ──
var profileOpen=false;
function toggleProfile(){
  profileOpen=!profileOpen;
  var form=document.getElementById('prof-edit-form');
  var btn=document.getElementById('prof-edit-btn');
  form.style.display=profileOpen?'flex':'none';
  btn.textContent=profileOpen?(lang==='zh'?'收起 ×':'Close ×'):(lang==='zh'?'编辑 ›':'Edit ›');
  if(profileOpen){
    var n=localStorage.getItem('gf_name'),d=localStorage.getItem('gf_date');
    if(n)document.getElementById('her-name').value=n;
    if(d)document.getElementById('ann-date').value=d;
  }
}
function saveProfile(){
  var name=document.getElementById('her-name').value.trim(),date=document.getElementById('ann-date').value;
  if(name)localStorage.setItem('gf_name',name);
  if(date)localStorage.setItem('gf_date',date);
  profileOpen=false;
  document.getElementById('prof-edit-form').style.display='none';
  document.getElementById('prof-edit-btn').textContent=lang==='zh'?'编辑 ›':'Edit ›';
  renderProfile();
}
function renderProfile(){
  var zh=lang==='zh';
  var name=localStorage.getItem('gf_name'),date=localStorage.getItem('gf_date');
  var nameEl=document.getElementById('prof-name-display');
  var daysEl=document.getElementById('prof-days-display');
  var milEl=document.getElementById('prof-milestones');
  var editBtn=document.getElementById('prof-edit-btn');
  editBtn.textContent=zh?'编辑 ›':'Edit ›';
  if(!name&&!date){
    nameEl.textContent=zh?'添加她的名字 ↗':'Add her name ↗';
    nameEl.style.color='rgba(255,107,157,.4)';
    nameEl.style.fontSize='.9rem';
    daysEl.textContent=zh?'点击"编辑"设置纪念日':'Click Edit to set anniversary';
    milEl.innerHTML='';
    return;
  }
  nameEl.textContent=name||'—';
  nameEl.style.color='';nameEl.style.fontSize='';
  if(!date){daysEl.textContent=zh?'纪念日未设置':'Anniversary not set';milEl.innerHTML='';return;}
  var days=Math.max(0,Math.floor((new Date()-new Date(date))/86400000));
  var weeks=Math.floor(days/7),months=Math.floor(days/30.4),years=Math.floor(days/365);
  daysEl.textContent=days.toLocaleString()+' '+(zh?'天在一起':'days together');
  milEl.innerHTML=
    (years>0?'<div class="prof-mil"><div class="prof-mil-val">'+years+'</div><div class="prof-mil-key">'+(zh?'年':years===1?'Yr':'Yrs')+'</div></div>':'')+
    (months>0?'<div class="prof-mil"><div class="prof-mil-val">'+months+'</div><div class="prof-mil-key">'+(zh?'月':months===1?'Mo':'Mos')+'</div></div>':'')+
    '<div class="prof-mil"><div class="prof-mil-val">'+weeks+'</div><div class="prof-mil-key">'+(zh?'周':weeks===1?'Wk':'Wks')+'</div></div>';
}

// ── CLINIC ──
function clinicStart(){
  var vKeys=Object.keys(D[lang].clinic.types);
  cQ=0;cSc=0;cV={};
  vKeys.forEach(function(k){cV[k]=0;});
  document.getElementById('clinic-intro').style.display='none';
  document.getElementById('clinic-quiz').style.display='block';
  document.getElementById('clinic-result').style.display='none';
  clinicRender();
}
function clinicReset(){
  cQ=0;cSc=0;
  document.getElementById('clinic-intro').style.display='block';
  document.getElementById('clinic-quiz').style.display='none';
  document.getElementById('clinic-result').style.display='none';
  if(document.getElementById('clinic-reset-btn'))document.getElementById('clinic-reset-btn').textContent=L[lang].clinicResetBtn;
}
function clinicRender(){
  var qs=D[lang].clinic.questions,q=qs[cQ];
  document.getElementById('clinic-phase').textContent=q.ph;
  document.getElementById('clinic-prog').textContent=(cQ+1)+'/'+qs.length;
  document.getElementById('clinic-pf').style.width=((cQ+1)/qs.length*100)+'%';
  document.getElementById('clinic-q').textContent=q.q;
  var d=document.getElementById('clinic-opts');d.innerHTML='';
  q.o.forEach(function(o){
    var b=document.createElement('button');b.className='clinic-opt';b.textContent=o.t;
    b.onclick=function(){clinicPick(o,b)};d.appendChild(b);
  });
}
function clinicPick(o,btn){
  document.querySelectorAll('.clinic-opt').forEach(function(b){b.classList.remove('sel')});
  btn.classList.add('sel');
  setTimeout(function(){
    if(o.s!==undefined)cSc+=o.s;
    if(o.tp!==undefined)cV[o.tp]=(cV[o.tp]||0)+1;
    cQ++;
    var qs=D[lang].clinic.questions;
    if(cQ<qs.length)clinicRender();else clinicResult();
  },280);
}

function clinicResult(){
  var cd=D[lang].clinic;
  var anger=cd.anger.find(function(a){return cSc>=a.r[0]&&cSc<=a.r[1]})||cd.anger[4];
  var tp=Object.entries(cV).sort(function(a,b){return b[1]-a[1]})[0][0];
  var type=cd.types[tp];
  var bars=Array(5).fill(0).map(function(_,i){return'<div style="flex:1;height:8px;border-radius:3px;background:'+(i<anger.p?anger.bd:'rgba(255,255,255,.08)')+'"></div>';}).join('');
  var tipsHtml=type.tips.map(function(t){return'<div class="clinic-result-tip" style="border-left:2px solid '+type.ac+'"><span style="font-size:.68rem;font-weight:600;color:'+type.ac+';margin-right:6px">'+t.lv+'</span>'+t.t+'</div>';}).join('');
  var avSvg=AV_BF[tp]||type.sv||'';
  var svgHtml=avSvg?'<div style="width:76px;margin:0 auto 10px">'+avSvg+'</div>':'';
  var isZh=lang==='zh';
  document.getElementById('clinic-result-content').innerHTML=
    '<div style="text-align:center;padding:.5rem 0 1rem">'
    +'<div style="font-size:.68rem;color:var(--muted);font-family:var(--mono);margin-bottom:6px">'+(isZh?'危险等级':'Danger level')+'</div>'
    +'<div style="display:inline-block;padding:5px 16px;background:'+anger.bg+';border:0.5px solid '+anger.bd+';color:'+anger.c+';font-size:.92rem;font-weight:500;margin-bottom:5px">'+anger.n+'</div>'
    +'<div style="font-size:.75rem;color:var(--muted);margin-bottom:8px">'+anger.d+'（'+cSc+'/'+(D[lang].clinic.questions.length/2*4)+' '+(isZh?'分':'pts')+'）</div>'
    +'<div style="display:flex;gap:4px;max-width:200px;margin:0 auto">'+bars+'</div>'
    +'</div>'
    +'<div style="background:'+type.bg+';border:0.5px solid '+type.bd+';padding:1rem;margin-bottom:1rem;text-align:center">'
    +svgHtml
    +'<div style="font-size:.65rem;color:#6b6b67;margin-bottom:3px">'+(isZh?'他的性格类型':'Personality type')+'</div>'
    +'<div style="font-size:1.05rem;font-weight:500;color:'+type.tc+';margin-bottom:5px">'+type.n+'</div>'
    +'<div style="font-size:.78rem;color:#6b6b67;line-height:1.6;margin-bottom:8px">'+type.d+'</div>'
    +'<div>'+type.tg.map(function(t){return'<span class="ec-tag" style="background:'+type.bg+';border:0.5px solid '+type.bd+';color:'+type.tc+'">'+t+'</span>';}).join('')+'</div>'
    +'</div>'
    +'<div style="font-size:.65rem;color:var(--muted);font-family:var(--mono);margin-bottom:7px">'+(isZh?'专属补救方案':'Recovery plan')+'</div>'
    +tipsHtml
    +'<div style="text-align:center;padding:.8rem 0 .3rem;font-size:.7rem;color:rgba(255,255,255,.18)">'+(isZh?'男生都是刀子嘴豆腐心，加油 ❤':'He’s tough on the outside, soft on the inside. You’ve got this ❤')+'</div>';
  document.getElementById('clinic-quiz').style.display='none';
  document.getElementById('clinic-result').style.display='block';
  document.getElementById('clinic-reset-btn').textContent=L[lang].clinicResetBtn;
}
